x-base: &base
  build:
    context: .
    dockerfile: .devcontainer/Dockerfile
  volumes:
    - .:/workspace
  working_dir: /workspace
  user: "${UID:-1000}:${GID:-1000}"

services:
  miner:
    <<: *base
    env_file: .env
    hostname: miner
    # Mantenemos el contenedor vivo para que puedas entrar con 'docker compose exec miner bash'
    command: tail -f /dev/null
    stdin_open: true
    tty: true

  analyzer:
    <<: *base
    hostname: analyzer
    # Levanta Jupyter sin token y con permisos de root
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' analyzer/
    ports:
      - "8888:8888"

  visualizer:
    <<: *base
    hostname: visualizer
    # Servidor HTTP para servir archivos del visualizer
    working_dir: /workspace/visualizer
    command: python -m http.server 8080
    ports:
      - "8080:8080"
